# Reference configuration for the hosted demo; the existing service was created with Render CLI (docs/31).
# Update that service instead of creating a second Blueprint deployment.
# Free plan: the service sleeps when idle, so open the URL a minute before presenting. Keys are entered in Render's
# dashboard (sync: false), never in this file.
services:
  - type: web
    name: zc-billpay-agent
    runtime: docker
    plan: free
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: LLM_PROVIDER        # change for another provider; fake is scripted backup only
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL        # re-check availability/quotas in the target AI Studio project
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACKS       # add only providers whose keys/models are configured in host secrets
        value: ""
      - key: LLM_REQUEST_INTERVAL_MS # optional fixed spacing; the rolling-minute cap below replaces it
        value: "0"
      - key: LLM_REQUESTS_PER_MIN # under Gemini's ~15/min; process-local, other processes still share the quota
        value: "14"
      - key: LLM_MAX_WAIT_MS     # wait for a slot / a 429 retry hint at most this, then "busy"
        value: "20000"
      - key: LLM_TURN_DEADLINE_MS # all model requests of one turn (the browser gives up at 60 s)
        value: "30000"
      - key: LLM_DAILY_TOKEN_CAP
        value: "2000000"
      - key: TURNS_PER_10_MIN    # per browser session
        value: "60"
      - key: TURNS_PER_10_MIN_IP # per client IP; judges behind one venue NAT share it
        value: "100"
      - key: TURNS_PER_10_MIN_GLOBAL # whole instance
        value: "150"
      - key: SANDBOX_MAX         # one in-memory wallet per browser session; the free plan has 512 MB
        value: "60"
      - key: SANDBOX_PROTECT_MIN # recently used or card pending: never evicted; full house answers "busy"
        value: "10"
      - key: SANDBOX_NEW_PER_IP_10_MIN
        value: "40"
      - key: DEMO_MODE
        value: "1"
      - key: LLM_CACHE
        value: "0"
      - key: ASR_PROVIDER
        value: "regalabs"
      - key: REGALABS_API_KEY
        sync: false
      - key: REGALABS_STREAM_URL
        value: "wss://api.regalabs.dev/v1/audio/transcriptions/stream"
      - key: REGALABS_ASR_LANGUAGE
        value: "auto"
      - key: ASR_NO_CONFIDENCE
        value: "readback"
